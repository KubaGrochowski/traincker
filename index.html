<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Traincker</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traincker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img src="icons/icon-192.png" alt="" width="56" height="56"><h1>Traincker</h1></div>
    <nav class="vtabs auth-tabs" role="tablist" aria-label="Konto">
      <button class="vtab" role="tab" data-auth="in" aria-selected="true">Zaloguj się</button>
      <button class="vtab" role="tab" data-auth="up" aria-selected="false">Załóż konto</button>
    </nav>
    <form id="auth-form" class="lform" novalidate>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="a-pass">Hasło</label><input id="a-pass" name="password" type="password" required minlength="6" autocomplete="current-password"></div>
      <div class="field" id="a-pass2-row" hidden><label for="a-pass2">Powtórz hasło</label><input id="a-pass2" name="password2" type="password" minlength="6" autocomplete="new-password"></div>
      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit" id="a-submit">Zaloguj się</button>
    </form>
  </div>
</section>

<main class="wrap" id="app-main">
  <header class="top">
    <div>
      <div class="brandrow"><img class="brand" src="icons/icon-192.png" alt="" width="22" height="22"><div class="eyebrow" id="top-label"></div></div>
      <div class="o-hero"><b id="hero-num">0</b><span id="hero-sub"></span></div>
    </div>
    <div class="actions">
      <button class="add" id="start-btn"><span class="plus" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1.5 6v4M14.5 6v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><rect x="3" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/><rect x="10.4" y="3.5" width="2.6" height="9" rx="1" fill="currentColor"/><path d="M5.6 8h4.8" stroke="currentColor" stroke-width="2"/></svg></span><span id="start-label">Start treningu</span></button>
      <button class="icon" id="menu-btn" aria-label="Menu"><svg class="ic-dots" width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.6" fill="currentColor"/><circle cx="8" cy="8" r="1.6" fill="currentColor"/><circle cx="13" cy="8" r="1.6" fill="currentColor"/></svg><svg class="ic-burger" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>

  <nav class="vtabs" role="tablist" aria-label="Widok">
    <button class="vtab" role="tab" data-view="workout" aria-selected="true">Trening</button>
    <button class="vtab" role="tab" data-view="history" aria-selected="false">Historia</button>
    <button class="vtab" role="tab" data-view="routines" aria-selected="false">Plany</button>
    <button class="vtab" role="tab" data-view="exercises" aria-selected="false">Ćwiczenia</button>
    <button class="vtab" role="tab" data-view="progress" aria-selected="false">Postępy</button>
  </nav>

  <section id="view-workout"></section>
  <section id="view-history" hidden></section>
  <section id="view-routines" hidden></section>
  <section id="view-exercises" hidden></section>
  <section id="view-progress" hidden></section>
</main>

<div class="restbar" id="restbar" hidden></div>
<div id="overlay"></div>
<script src="js/cloud.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<title>Traincker</title>
<link rel="icon" type="image/png" sizes="64x64" href="icons/favicon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Traincker">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="css/styles.css?v=17">
</head>
<body>
<section class="auth" id="auth" hidden>
  <div class="auth-card">
    <div class="auth-brand"><img src="icons/icon-192.png" alt="" width="56" height="56"><h1>Traincker</h1></div>
    <nav class="vtabs auth-tabs" role="tablist" aria-label="Konto">
      <button class="vtab" role="tab" data-auth="in" aria-selected="true">Zaloguj się</button>
      <button class="vtab" role="tab" data-auth="up" aria-selected="false">Załóż konto</button>
    </nav>
    <form id="auth-form" class="lform" novalidate>
      <div class="field"><label for="a-email">E-mail</label><input id="a-email" name="email" type="email" required autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false"></div>
      <div class="field"><label for="a-pass">Hasło</label><input id="a-pass" name="password" type="password" required minlength="6" autocomplete="current-password"></div>
      <div class="field" id="a-pass2-row" hidden><label for="a-pass2">Powtórz hasło</label><input id="a-pass2" name="password2" type="password" minlength="6" autocomplete="new-password"></div>
      <p class="auth-err" id="auth-err" role="alert" hidden></p>
      <button class="primary" type="submit" id="a-submit">Zaloguj się</button>
    </form>
  </div>
</section>

<main class="shell" id="app-main">
  <div id="tab-view"></div>
  <button class="livebar" id="livebar" hidden></button>
  <button class="fab" id="fab" aria-label="Nowy trening"><svg width="22" height="22" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1.5v11M1.5 7h11" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
  <nav class="tabbar" id="tabbar" aria-label="Zakładki">
    <button data-tab="log" aria-label="Treningi"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="4" y="4.5" width="16" height="16" rx="3" stroke="currentColor" stroke-width="1.8"/><path d="M8 2.8v3.4M16 2.8v3.4M4 9.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M8.5 14.5l2.3 2.2 4.7-4.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Treningi</span></button>
    <button data-tab="routines" aria-label="Plany"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="4.5" cy="6" r="1.4" fill="currentColor"/><circle cx="4.5" cy="12" r="1.4" fill="currentColor"/><circle cx="4.5" cy="18" r="1.4" fill="currentColor"/></svg><span>Plany</span></button>
    <button data-tab="exercises" aria-label="Ćwiczenia"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M2.5 9.5v5M21.5 9.5v5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="4.6" y="6" width="3.4" height="12" rx="1.2" stroke="currentColor" stroke-width="1.7"/><rect x="16" y="6" width="3.4" height="12" rx="1.2" stroke="currentColor" stroke-width="1.7"/><path d="M8 12h8" stroke="currentColor" stroke-width="1.8"/></svg><span>Ćwiczenia</span></button>
    <button data-tab="progress" aria-label="Postępy"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 19.5h16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><rect x="5.5" y="12" width="3" height="5.5" rx="1" fill="currentColor"/><rect x="10.5" y="8" width="3" height="9.5" rx="1" fill="currentColor"/><rect x="15.5" y="4.5" width="3" height="13" rx="1" fill="currentColor"/></svg><span>Postępy</span></button>
    <button data-tab="more" aria-label="Więcej"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><span>Więcej</span></button>
  </nav>
</main>

<section class="layer" id="wk-layer" hidden></section>
<section class="layer dt" id="dt-layer" hidden></section>
<div id="overlay"></div>
<script src="js/cloud.js?v=17"></script>
<script src="js/exercises.js?v=17"></script>
<script src="js/app.js?v=17"></script>
</body>
</html>
